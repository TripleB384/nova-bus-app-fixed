<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver — Nova Bus Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="dash-page">
  <div class="dash-shell">
    <div class="dash-topbar">
      <div class="dash-topbar-inner">
        <div class="topbar-brand">
          <div class="topbar-mark">🚌</div>
          <div class="topbar-brand-text">
            <span class="school-name">Nova High School</span>
            <span class="page-name">Bus Tracker</span>
          </div>
        </div>
        <button id="logout-btn" class="logout-btn">Log Out</button>
      </div>
    </div>

    <div class="dash-body">
      <div class="welcome-banner">
        <div>
          <h1>Driver Dashboard</h1>
          <p id="welcome-msg">Loading...</p>
        </div>
        <span class="role-pill">DRIVER</span>
      </div>

      <p id="error-msg"></p>

      <p class="section-label">Route</p>
      <div class="card-grid">
        <div class="admin-card is-expanded">
          <div class="card-header">
            <div class="admin-card-icon">🚍</div>
            <h2>Start Route</h2>
            <span class="card-chevron">▾</span>
          </div>
          <div class="card-detail">
            <p id="tracking-status">Begin sharing your live location while you drive.</p>
            <button id="tracking-toggle">Start Sharing Location</button>
            <div id="bus-map" style="height: 280px; border-radius: 10px; margin-top: 1rem; overflow: hidden; display: none;"></div>
          </div>
        </div>
        <div class="admin-card">
          <div class="card-header">
            <div class="admin-card-icon">🕒</div>
            <h2>Trip Summary</h2>
            <span class="card-chevron">▾</span>
          </div>
          <div class="card-detail">
            <p id="trip-summary">Not sharing your location right now.</p>
          </div>
        </div>
        <div class="admin-card">
          <div class="card-header">
            <div class="admin-card-icon">⏱️</div>
            <h2>Report Delay</h2>
            <span class="card-chevron">▾</span>
          </div>
          <div class="card-detail">
            <p id="delay-status">No delay reported.</p>
            <div class="card-form">
              <input type="number" id="delay-minutes" placeholder="Minutes late" min="1">
              <input type="text" id="delay-note" placeholder="Note (optional)">
              <button id="delay-submit">Report Delay</button>
              <p id="delay-error" class="form-error"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="cards.js" defer></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="driver.js"></script>
</body>
</html>
