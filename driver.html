<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver — Nova Bus Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dash-page">
  <div class="dash-shell">
    <div class="dash-topbar">
      <div class="dash-topbar-inner">
        <div class="topbar-brand">
          <div class="topbar-mark">🚌</div>
          <div class="topbar-brand-text">
            <span class="school-name">Nova High School</span>
            <span class="page-name">Bus Tracker</span>
          </div>
        </div>
        <button id="logout-btn" class="logout-btn">Log Out</button>
      </div>
    </div>

    <div class="dash-body">
      <div class="welcome-banner">
        <div>
          <h1>Driver Dashboard</h1>
          <p id="welcome-msg">Loading...</p>
        </div>
        <span class="role-pill">DRIVER</span>
      </div>

      <p id="error-msg"></p>

      <p class="section-label">Route</p>
      <div class="card-grid">
        <div class="admin-card" style="cursor: default;">
          <div class="admin-card-icon">🚍</div>
          <h2>Start Route</h2>
          <p id="tracking-status">Begin sharing your live location for today's route.</p>
          <button id="tracking-toggle">Start Sharing Location</button>
        </div>
        <div class="admin-card">
          <div class="admin-card-icon">🗺️</div>
          <h2>My Route</h2>
          <p>View your assigned stops and pickup order.</p>
        </div>
        <div class="admin-card">
          <div class="admin-card-icon">⏱️</div>
          <h2>Report Delay</h2>
          <p>Let riders know if you're running behind schedule.</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="driver.js"></script>
</body>
</html>
