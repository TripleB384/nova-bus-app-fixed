<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student — Nova Bus Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="dash-page">
  <div class="dash-shell">
    <div class="dash-topbar">
      <div class="dash-topbar-inner">
        <div class="topbar-brand">
          <div class="topbar-mark">🚌</div>
          <div class="topbar-brand-text">
            <span class="school-name">Nova High School</span>
            <span class="page-name">Bus Tracker</span>
          </div>
        </div>
        <button id="logout-btn" class="logout-btn">Log Out</button>
      </div>
    </div>

    <div class="dash-body">
      <div class="welcome-banner">
        <div>
          <h1>Student Dashboard</h1>
          <p id="welcome-msg">Loading...</p>
        </div>
        <span class="role-pill">STUDENT</span>
      </div>

      <p class="section-label">My Bus</p>
      <div class="card-grid">
        <div class="admin-card is-expanded" id="map-card">
          <div class="card-header">
            <div class="admin-card-icon">🚌</div>
            <h2>Live Location</h2>
            <span class="card-chevron">▾</span>
          </div>
          <div class="card-detail">
            <p>See exactly where your bus is right now.</p>
            <div id="bus-map" style="height: 320px; border-radius: 10px; margin-top: 1rem; overflow: hidden;"></div>
            <p id="delay-banner" class="delay-banner"></p>
          </div>
        </div>
        <div class="admin-card">
          <div class="card-header">
            <div class="admin-card-icon">⏱️</div>
            <h2>Arrival Time</h2>
            <span class="card-chevron">▾</span>
          </div>
          <div class="card-detail">
            <p>Check the estimated time your bus reaches your stop.</p>
          </div>
        </div>
        <div class="admin-card">
          <div class="card-header">
            <div class="admin-card-icon">📅</div>
            <h2>Schedule</h2>
            <span class="card-chevron">▾</span>
          </div>
          <div class="card-detail">
            <p>View your pickup time for today.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="cards.js" defer></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="student.js"></script>
</body>
</html>
