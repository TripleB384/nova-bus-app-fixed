<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher — Nova Bus Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="dash-page">
  <div class="dash-shell">
    <div class="dash-topbar">
      <div class="dash-topbar-inner">
        <div class="topbar-brand">
          <div class="topbar-mark">🚌</div>
          <div class="topbar-brand-text">
            <span class="school-name">Nova High School</span>
            <span class="page-name">Bus Tracker</span>
          </div>
        </div>
        <button id="logout-btn" class="logout-btn">Log Out</button>
      </div>
    </div>

    <div class="dash-body">
      <div class="welcome-banner">
        <div>
          <h1>Teacher Dashboard</h1>
          <p id="welcome-msg">Loading...</p>
        </div>
        <span class="role-pill">TEACHER</span>
      </div>

      <p class="section-label">Overview</p>
      <div class="card-grid">
        <div class="admin-card" style="cursor: default;">
          <div class="admin-card-icon">🗺️</div>
          <h2>Live Bus Map</h2>
          <p>Track every bus's current location in real time.</p>
          <div id="bus-map" style="height: 320px; border-radius: 10px; margin-top: 1rem; overflow: hidden;"></div>
        </div>
        <div class="admin-card">
          <div class="admin-card-icon">⏱️</div>
          <h2>Arrival Times</h2>
          <p>See estimated and actual arrival times by route.</p>
        </div>
        <div class="admin-card">
          <div class="admin-card-icon">🔔</div>
          <h2>Delay Alerts</h2>
          <p>Review delay reports submitted by drivers today.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="teacher.js"></script>
</body>
</html>
